<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mandarin Talk</title>
<meta name="description" content="Practical Mandarin for aviation, business and travel — English, Chinese and pinyin side by side.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="referrer" content="no-referrer"><!-- the online voice refuses requests that name another website -->
<meta name="apple-mobile-web-app-title" content="Mandarin Talk">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><!-- icon used by iPhone "Add to Home Screen" -->
<meta name="theme-color" id="themeColor" content="#F2F2F7">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b8322a'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='PingFang SC,Hiragino Sans GB,sans-serif'%3E说%3C/text%3E%3C/svg%3E">
<style>
/* ════════════════════════════════════════════════════════════════
   Mandarin Talk — iOS-style design system
   System font, Apple system colours, frosted bars, rounded cards.
   Every font size is multiplied by --fs (Settings → Text size); readable text never drops below 12px.
   ════════════════════════════════════════════════════════════════ */
@property --p{syntax:"<number>";inherits:false;initial-value:0}
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#E9E9EE; --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.2);
  --ink:#1C1C1E; --ink-2:#3A3A3C; --muted:#6E6E73; --line:#E3E3E8; --sep:rgba(60,60,67,.18);
  --accent:#E5352B; --accent-ink:#fff; --accent-soft:#FDE8E6;
  --jade:#248A3D; --jade-fill:#248A3D; --jade-soft:#E3F4E7; --amber:#B25E00; --amber-soft:#FFF4E2; --blue:#0066D6;
  --t1:#E5352B; --t2:#D07300; --t3:#248A3D; --t4:#0066D6; --t5:#8E8E93;
  --glass:rgba(249,249,251,.78); --glass-line:rgba(0,0,0,.08);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
  --shadow-lg:0 2px 6px rgba(0,0,0,.06),0 18px 50px rgba(0,0,0,.14);
  --wash:#3A3A3C; --paper:var(--bg);
  --r:14px; --r-lg:22px; --radius:var(--r);
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.5,.64,1); --sheet-ease:cubic-bezier(.32,.72,0,1);
  --fs:1;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --zh:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --zh-serif:var(--zh);
  --top-h:52px; --tab-h:56px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.34);
    --ink:#F5F5F7; --ink-2:#D1D1D6; --muted:#98989D; --line:#38383A; --sep:rgba(84,84,88,.6);
    --accent:#FF453A; --accent-soft:#3A1614; --jade:#32D74B; --jade-fill:#248A3D; --jade-soft:#14301C; --amber:#FFB340; --amber-soft:#2E2312; --blue:#0A84FF;
    --t1:#FF6961; --t2:#FFB340; --t3:#32D74B; --t4:#5EA8FF; --t5:#98989D;
    --glass:rgba(28,28,30,.72); --glass-line:rgba(255,255,255,.08);
    --shadow:0 0 0 .5px rgba(255,255,255,.06); --shadow-lg:0 0 0 .5px rgba(255,255,255,.08),0 24px 60px rgba(0,0,0,.6);
    --wash:#D1D1D6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.34);
  --ink:#F5F5F7; --ink-2:#D1D1D6; --muted:#98989D; --line:#38383A; --sep:rgba(84,84,88,.6);
  --accent:#FF453A; --accent-soft:#3A1614; --jade:#32D74B; --jade-fill:#248A3D; --jade-soft:#14301C; --amber:#FFB340; --amber-soft:#2E2312; --blue:#0A84FF;
  --t1:#FF6961; --t2:#FFB340; --t3:#32D74B; --t4:#5EA8FF; --t5:#98989D;
  --glass:rgba(28,28,30,.72); --glass-line:rgba(255,255,255,.08);
  --shadow:0 0 0 .5px rgba(255,255,255,.06); --shadow-lg:0 0 0 .5px rgba(255,255,255,.08),0 24px 60px rgba(0,0,0,.6);
  --wash:#D1D1D6;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:calc(16px*var(--fs))/1.45 var(--sys);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));transition:background .3s}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 60%,transparent);outline-offset:2px;border-radius:10px}
a{color:inherit}
svg{display:block;flex:none}
.wrap{max-width:1040px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}

/* ── press feedback: everything tappable sinks a little ── */
.btn,.ic,.chip,.tab,.card,.mini,.icon-btn,.fab,.tb,.seg button,.say-big,.kstar,.sh-mic,.pill,.mrow,.coach-btn{transition:transform .18s var(--spring),background-color .2s,color .2s,box-shadow .2s,opacity .2s}
.btn:active,.ic:active,.chip:active,.tab:active,.icon-btn:active,.fab:active,.seg button:active,.say-big:active,.kstar:active,.pill:active,.coach-btn:active{transform:scale(.94)}
.card:active,.mini:active,.mrow:active{transform:scale(.975)}
.tb:active{transform:scale(.9)}

/* ── top bar: frosted glass ── */
.top{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 .5px 0 var(--sep);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:10px;height:var(--top-h)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;flex:none}
.seal{width:32px;height:32px;border-radius:9px;background:linear-gradient(160deg,#FF5A4F,#D72B21);color:#fff;display:grid;place-items:center;font:600 19px/1 var(--zh);box-shadow:0 1px 3px rgba(215,43,33,.35)}
.brand b{font-size:calc(17px*var(--fs));font-weight:600;letter-spacing:-.02em}
.search{flex:1;display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:11px;padding:0 10px;height:38px;min-width:0;transition:background .2s,box-shadow .2s}
.search:focus-within{background:var(--surface);box-shadow:0 0 0 2px color-mix(in srgb,var(--blue) 55%,transparent)}
.search svg{color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:calc(16px*var(--fs));outline:none;-webkit-appearance:none}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--accent);flex:none;position:relative}
.icon-btn:hover{background:var(--fill)}
.icon-btn.new::after{content:"";position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg);animation:dot 1.8s ease-in-out infinite}
@keyframes dot{50%{transform:scale(1.35)}}
@media (max-width:560px){.brand b{display:none}}

/* ── page entrance + stagger ── */
.enter>*{animation:rise .5s var(--ease) both;animation-delay:calc(min(var(--i,0),8) * 45ms)}
.enter .cards>*,.enter .hscroll>*,.enter .badges>*,.enter .keys-grid>*{animation:rise .5s var(--ease) both;animation-delay:calc(120ms + min(var(--j,0),10) * 35ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
@keyframes fadein{from{opacity:0}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.28)}70%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes ring{from{box-shadow:0 0 0 0 currentColor;opacity:1}to{box-shadow:0 0 0 14px currentColor;opacity:0}}
.pop{animation:pop .45s var(--spring)}

/* ── typography helpers ── */
.hello{margin:20px 0 14px;font-size:calc(clamp(28px,5vw,34px)*var(--fs));line-height:1.12;letter-spacing:-.03em;font-weight:700}
.hello span{color:var(--accent);font-family:var(--zh);font-weight:600;white-space:nowrap}

/* ── progress bars ── */
.bar{height:6px;border-radius:6px;background:var(--fill);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--jade);border-radius:6px;transition:width .8s var(--ease);transform-origin:left}
.enter .bar i{animation:grow 1s var(--ease) both .2s}
@keyframes grow{from{transform:scaleX(0)}}

/* ── home: goal widget ── */
.goal{position:relative;overflow:hidden;display:flex;align-items:center;gap:18px;background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.goal-art{--paper:var(--surface);position:absolute;top:0;bottom:0;right:0;width:60%;opacity:.28;pointer-events:none;-webkit-mask-image:linear-gradient(to right,transparent,#000 70%);mask-image:linear-gradient(to right,transparent,#000 70%)}
.ring{--p:0;flex:none;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--jade) calc(var(--p)*1%),var(--fill) 0);display:grid;place-items:center;position:relative;transition:--p 1.1s var(--ease)}
.enter .ring{animation:ringfill 1.2s var(--ease) both .15s}
@keyframes ringfill{from{--p:0}}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--surface)}
.ring div{position:relative;text-align:center;line-height:1.05}
.ring b{font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.goal-txt{position:relative;min-width:0;flex:1}
.goal-h{font-weight:700;font-size:calc(19px*var(--fs));line-height:1.2;letter-spacing:-.02em}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.pill{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:14px;background:var(--fill);font-size:max(12px,calc(13px*var(--fs)));font-weight:600;color:var(--ink-2);white-space:nowrap;text-decoration:none}
.pill svg{width:15px;height:15px}
.pill.hot{background:var(--accent-soft);color:var(--accent)}
.goal-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ── category chips (scroll sideways) ── */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:18px -16px 0;padding:2px 16px 4px;scroll-padding:16px}
.chips::-webkit-scrollbar,.hscroll::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 16px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;font-size:max(12px,calc(14px*var(--fs)));color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}

/* ── sections ── */
.area{margin-top:30px;scroll-margin-top:80px}
.area h2{display:flex;align-items:baseline;gap:8px;margin:0 0 12px;font-size:calc(22px*var(--fs));font-weight:700;letter-spacing:-.025em}
.area h2 span{font-family:var(--zh);color:var(--muted);font-weight:500;font-size:calc(17px*var(--fs))}
.area h2 em{margin-left:auto;font-style:normal;font-size:max(12px,calc(14px*var(--fs)));color:var(--muted);font-weight:500}
.news{margin:28px 0 4px;display:flex;gap:10px;align-items:baseline;font-size:max(12px,calc(14px*var(--fs)));color:var(--muted);flex-wrap:wrap;background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.news b{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}

/* ── module cards (App Store style) ── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{display:block;position:relative;overflow:hidden;text-decoration:none;background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
@media (hover:hover){.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}.card:hover .card-art svg{transform:scale(1.05)}}
.card-art{--paper:var(--surface);height:96px;margin:-16px -16px 12px;background:var(--surface)}
.card-art svg{transition:transform .7s var(--ease)}
.card .zhT{font:600 calc(21px*var(--fs))/1.2 var(--zh);letter-spacing:0}
.card .enT{font-weight:600;font-size:calc(16px*var(--fs));margin-top:3px;line-height:1.25;letter-spacing:-.015em}
.card .meta{font-size:max(12px,calc(13px*var(--fs)));color:var(--muted);margin-top:3px}
.card .foot{display:flex;justify-content:space-between;font-size:max(12px,calc(12px*var(--fs)));color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.card.mine{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.card.mine .card-art{--paper:var(--bg);background:var(--bg)}
.tag-new{position:absolute;top:10px;left:10px;font:700 12px/1 var(--sys);background:var(--accent);color:#fff;padding:5px 8px;border-radius:8px;letter-spacing:.01em;z-index:1}
.medal{position:absolute;top:9px;right:9px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;z-index:1;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.medal svg{width:17px;height:17px}
.m1{background:linear-gradient(160deg,#E0A070,#B2693A)} .m2{background:linear-gradient(160deg,#D8DBE0,#9A9EA6)} .m3{background:linear-gradient(160deg,#FFD866,#D9A400)}
@media (max-width:600px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .card{padding:12px;border-radius:20px}
  .card-art{height:80px;margin:-12px -12px 10px}
  .card .zhT{font-size:calc(18px*var(--fs))}
  .card .enT{font-size:calc(15px*var(--fs))}
}

/* ── jump back in: horizontal shelf ── */
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 10px;scroll-snap-type:x mandatory;scroll-padding:16px}
.mini{flex:none;width:250px;scroll-snap-align:start;display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:10px;text-decoration:none;box-shadow:var(--shadow)}
.mini .art{--paper:var(--fill);width:58px;height:58px;border-radius:13px;overflow:hidden;flex:none;background:var(--surface-2)}
.mini div:last-child{min-width:0;flex:1}
.mini b{display:block;font-size:calc(15px*var(--fs));line-height:1.25;font-weight:600}
.mini small{display:block;font-size:max(12px,calc(13px*var(--fs)));color:var(--muted);margin-top:2px}
.mini .bar{margin-top:7px}

/* ── buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 18px;border-radius:13px;font-weight:600;font-size:calc(16px*var(--fs));background:var(--fill);color:var(--accent);text-decoration:none;white-space:nowrap;letter-spacing:-.01em}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.ghost{background:var(--fill);color:var(--accent)}
.btn.small{height:36px;padding:0 14px;border-radius:11px;font-size:max(12px,calc(15px*var(--fs)))}
.btn.got{background:var(--jade-fill);color:#fff;box-shadow:0 4px 14px rgba(36,138,61,.3)}
@media (hover:hover){.btn:hover{filter:brightness(1.06)}}

/* ── module page header ── */
.mhead{position:relative;padding:18px 0 4px}
.mhead>*{position:relative;z-index:1}
.mhead-art{position:absolute!important;z-index:0!important;top:0;bottom:-10px;right:-16px;width:58%;pointer-events:none;opacity:.8;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 40%,#000 90%,transparent),linear-gradient(#000 55%,transparent);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(to right,transparent,#000 40%,#000 90%,transparent),linear-gradient(#000 55%,transparent);mask-composite:intersect}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--accent);text-decoration:none;font-size:calc(17px*var(--fs));margin:0 0 10px -6px;padding:4px 6px;border-radius:8px}
.back svg{width:20px;height:20px;stroke-width:2.6}
.mtitle{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.mtitle h1{margin:0;font-size:calc(clamp(28px,4.6vw,34px)*var(--fs));letter-spacing:-.03em;line-height:1.1;font-weight:700}
.mtitle .zhT{font:600 calc(clamp(18px,3vw,22px)*var(--fs))/1.2 var(--zh);color:var(--accent);margin-bottom:3px}
.mtitle .grow{flex:1}
.mstats{color:var(--muted);font-size:calc(15px*var(--fs));margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mstats .medal{position:static;width:22px;height:22px;box-shadow:none}
.mstats .medal svg{width:13px;height:13px}
.mbtns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.mbtns:empty{display:none}

/* ── segmented control + switch (iOS) ── */
.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:2px;gap:0;position:relative}
.seg button{height:32px;padding:0 14px;border-radius:8px;font-size:max(12px,calc(14px*var(--fs)));font-weight:600;color:var(--ink);transition:background-color .25s var(--ease),box-shadow .25s,transform .18s var(--spring)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}
.seg button:disabled{opacity:.3;cursor:default}
.switch{display:inline-flex;align-items:center;gap:10px;font-size:max(12px,calc(15px*var(--fs)));font-weight:500;color:var(--ink);cursor:pointer;user-select:none}
.switch input{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill-2);position:relative;cursor:pointer;margin:0;flex:none;transition:background .25s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .3s var(--spring)}
.switch input:checked{background:#34C759}
.switch input:checked::after{transform:translateX(20px)}

/* ── topic tabs (sticky, scroll sideways) ── */
.tabs{position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top));z-index:10;margin:16px -16px 0;padding:10px 16px;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
.tab{flex:none;height:36px;padding:0 14px;border-radius:18px;background:var(--fill);color:var(--ink);font-weight:600;font-size:max(12px,calc(14px*var(--fs)));display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.tab svg{width:16px;height:16px}
@media (hover:hover) and (min-width:700px){.tabs{flex-wrap:wrap;overflow:visible}}
.tab em{font-style:normal;font-weight:600;color:var(--muted);font-size:max(12px,calc(13px*var(--fs)));font-variant-numeric:tabular-nums}
.tab.done em{color:var(--jade)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab[aria-selected="true"] em{color:inherit;opacity:.7}
.tools{display:flex;gap:12px 16px;align-items:center;flex-wrap:wrap;margin-top:16px}
.tools .grow{flex:1}
.pane-in{animation:paneIn .42s var(--ease) both}
@keyframes paneIn{from{opacity:0;transform:translateX(18px)}}

/* ── phrase list: inset grouped ── */
.group{margin-top:18px}
.group h3{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin:0 4px 8px;font-size:calc(20px*var(--fs));font-weight:700;letter-spacing:-.02em}
.group h3 span{font:500 calc(16px*var(--fs)) var(--zh);color:var(--muted);white-space:nowrap}
.group h3 em{margin-left:auto;font-style:normal;font-size:max(12px,calc(14px*var(--fs)));color:var(--muted);font-weight:500}
.list{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) auto;gap:18px;padding:16px 16px 16px 18px;align-items:start;transition:background-color .35s var(--ease)}
.row+.row::before{content:"";position:absolute;top:0;left:18px;right:0;height:1px;background:var(--sep);transform:scaleY(.5);transform-origin:top}
.row.is-known{background:color-mix(in srgb,var(--jade-soft) 60%,var(--surface))}
.en-t{margin:2px 0 0;font-size:calc(17px*var(--fs));line-height:1.4;font-weight:500;letter-spacing:-.015em}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:8px}
.lvl{font-size:max(12px,calc(12px*var(--fs)));font-weight:700;padding:3px 9px;border-radius:7px;line-height:1.35;letter-spacing:.01em}
.lvl.E{background:var(--jade-soft);color:var(--jade)}
.lvl.M{background:var(--amber-soft);color:var(--amber)}
.lvl.H{background:var(--accent-soft);color:var(--accent)}
.note{font-size:calc(14.5px*var(--fs));color:var(--muted);line-height:1.45;margin-top:8px}
.mod-label{font-size:max(12px,calc(13px*var(--fs)));color:var(--muted)}
.zh{display:flex;flex-wrap:wrap;align-content:flex-start;text-align:left;border-radius:12px;padding:3px 5px;margin:-3px -5px;cursor:pointer;transition:background-color .2s}
@media (hover:hover){.zh:hover{background:var(--fill)}}
.zh:active{background:var(--fill-2)}
.c{display:inline-flex;flex-direction:column;align-items:center;margin:0 1px 4px}
.c b{font:400 calc(23px*var(--fs))/1.25 var(--zh);color:var(--ink);transition:color .2s}
.c i{font:500 max(12px,calc(13px*var(--fs)))/1.25 var(--sys);font-style:normal;color:var(--t5);min-height:16px;padding:0 1px;white-space:nowrap;letter-spacing:0}
.c.x b{font-family:var(--sys)}
.tones .c.t1 i{color:var(--t1)} .tones .c.t2 i{color:var(--t2)} .tones .c.t3 i{color:var(--t3)} .tones .c.t4 i{color:var(--t4)}
.no-py .c i{display:none}
.playing .c b{color:var(--accent)}
.acts{display:grid;grid-template-columns:38px 38px;gap:8px;align-content:start}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--fill);position:relative}
@media (hover:hover){.ic:hover{background:var(--fill-2)}}
.ic.say.playing,.say-big.playing{color:#fff;background:var(--accent)}
.ic.say.playing::after,.say-big.playing::after{content:"";position:absolute;inset:0;border-radius:inherit;color:var(--accent);animation:ring 1.1s var(--ease) infinite}
.ic.tick[aria-pressed="true"]{background:var(--jade-fill);color:#fff}
.ic.star[aria-pressed="true"]{background:var(--amber-soft);color:var(--amber)}
[aria-pressed="true"]>.star-i{fill:currentColor}
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:calc(16px*var(--fs))}
.section-note{font-size:max(12px,calc(14px*var(--fs)));color:var(--muted);margin:12px 4px 0;line-height:1.5}
@media (max-width:600px){
  /* phrase cards stack: English, then Chinese full width, then tip, then level + buttons */
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"en en" "zh zh" "note note" "meta acts";gap:0 12px;padding:16px}
  .row+.row::before{left:16px}
  .row .en{display:contents}
  .row .en-t{grid-area:en;margin:0}
  .row .zh{grid-area:zh;margin:8px -5px 0}
  .row .note{grid-area:note}
  .row .en>.meta{grid-area:meta;align-self:center;margin-top:12px}
  .row .acts{grid-area:acts;display:flex;flex-direction:row;margin-top:12px;gap:8px}
  .row .ic{width:42px;height:42px}
  .c b{font-size:calc(24px*var(--fs))}
}

/* ── Remember cards ── */
.keys{margin-top:16px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.keys h3{display:flex;align-items:baseline;gap:10px;margin:0;padding:16px 18px 4px;font-size:calc(20px*var(--fs));font-weight:700;letter-spacing:-.02em}
.keys h3 span{font:500 calc(16px*var(--fs)) var(--zh);color:var(--muted)}
.keys h3 em{margin-left:auto;font-style:normal;font-size:max(12px,calc(14px*var(--fs)));color:var(--muted);font-weight:500}
.hear-hint{display:flex;align-items:center;gap:6px;margin:0;padding:0 18px 12px;font-size:max(12px,calc(14px*var(--fs)));color:var(--muted)}
.hear-hint svg{width:16px;height:16px;color:var(--accent)}
.keys-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding:0 14px 14px}
.key{background:var(--amber-soft);border-radius:16px;padding:14px 46px 14px 14px;position:relative}
.kstar{position:absolute;top:6px;right:6px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--amber)}
.kstar[aria-pressed="true"]{background:color-mix(in srgb,var(--amber) 16%,transparent)}
.key>i{display:block;font-style:normal;font-size:max(12px,calc(13px*var(--fs)));color:var(--muted);margin-top:6px}
.key>b{display:block;font-size:calc(16px*var(--fs));color:var(--amber);margin-bottom:4px;font-weight:700;letter-spacing:-.015em}
.key>span{display:block;font-size:calc(15px*var(--fs));line-height:1.5;color:var(--ink)}
.key .c{margin:0 1px 3px;vertical-align:baseline}
.key .c b{font-size:calc(18px*var(--fs));line-height:1.2}
.key>b .c b{color:inherit;font-weight:600}
.key .c i{font-size:max(12px,calc(12px*var(--fs)))}
.zs{cursor:pointer;border-radius:8px;transition:background-color .2s}
@media (hover:hover){.zs:hover{background:color-mix(in srgb,var(--amber) 14%,transparent)}}
.zs.playing .c b{color:var(--accent)}

/* ── pager ── */
.pager{display:flex;gap:10px;margin-top:20px}
.pager .btn{flex:1;min-width:0;height:auto;min-height:54px;padding:10px 16px;white-space:normal;line-height:1.25;text-align:center;border-radius:16px;font-size:calc(16px*var(--fs))}

/* ── my phrases editor ── */
.editor{background:var(--surface);border-radius:var(--r-lg);padding:18px;margin-top:16px;box-shadow:var(--shadow)}
.editor textarea{width:100%;min-height:260px;border:0;border-radius:12px;background:var(--fill);color:var(--ink);font:calc(15px*var(--fs))/1.6 ui-monospace,"SF Mono",Menlo,monospace;padding:12px 14px;resize:vertical;outline:none}
.editor textarea:focus{box-shadow:0 0 0 2px color-mix(in srgb,var(--blue) 55%,transparent)}
.editor p{margin:0 0 12px;font-size:calc(15px*var(--fs));color:var(--ink-2);line-height:1.5}
.editor code{background:var(--fill);padding:1px 6px;border-radius:6px;font-size:max(12px,calc(14px*var(--fs)))}
.editor .btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}

/* ── settings: iOS bottom sheet on phones, popover on wide screens ── */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility 0s .35s}
.sheet-bg.open{opacity:1;visibility:visible;transition:opacity .35s var(--ease)}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:88vh;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:20px 20px 0 0;
  padding:8px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg);transform:translateY(105%);visibility:hidden;transition:transform .5s var(--sheet-ease),visibility 0s .5s}
.sheet.open{transform:none;visibility:visible;transition:transform .5s var(--sheet-ease)}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--fill-2);margin:0 auto 8px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 6px}
.sheet-head h3{margin:0;font-size:calc(20px*var(--fs));font-weight:700;letter-spacing:-.02em}
.sheet-done{color:var(--accent);font-weight:600;font-size:calc(17px*var(--fs));padding:6px 8px;border-radius:8px}
.sheet h4{margin:18px 16px 7px;font-size:max(12px,calc(13px*var(--fs)));text-transform:uppercase;letter-spacing:.02em;color:var(--muted);font-weight:500}
.grp{background:var(--surface);border-radius:12px;overflow:hidden}
.sheet .opt{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;min-height:50px;padding:9px 16px;font-size:calc(16px*var(--fs));position:relative;width:100%}
.sheet .opt+.opt::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.sheet .opt.switch{font-weight:400}
.sheet .voice{font-size:max(12px,calc(13px*var(--fs)));color:var(--muted);margin:8px 16px 0;line-height:1.45}
#fsSeg{align-items:center}
#fsSeg span{min-width:3.6em;text-align:center;font-size:max(12px,calc(14px*var(--fs)));font-weight:600;font-variant-numeric:tabular-nums}
.danger{display:block;text-align:left;color:var(--accent);font-size:calc(16px*var(--fs))}
.danger small{display:block;font-weight:400;color:var(--muted);font-size:max(12px,calc(13px*var(--fs)));margin-top:2px}
@media (min-width:700px){
  .sheet{left:auto;right:16px;bottom:auto;top:calc(var(--top-h) + 10px + env(safe-area-inset-top));width:400px;max-height:calc(100vh - 90px);border-radius:20px;padding-bottom:18px;
    transform:translateY(-8px) scale(.96);transform-origin:top right;opacity:0;transition:transform .35s var(--spring),opacity .25s,visibility 0s .35s}
  .sheet.open{transform:none;opacity:1;transition:transform .35s var(--spring),opacity .2s}
  .grabber{display:none}
}

/* ── practice (full screen) ── */
.pr{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  opacity:0;visibility:hidden;transform:translateY(30px);transition:opacity .35s var(--ease),transform .45s var(--sheet-ease),visibility 0s .45s}
.pr.open{opacity:1;visibility:visible;transform:none;transition:opacity .3s var(--ease),transform .45s var(--sheet-ease)}
.pr-top{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:760px;width:100%;margin:0 auto}
.pr-top .icon-btn{background:var(--fill);color:var(--ink-2);width:34px;height:34px}
.pr-top .count{font-weight:600;font-size:calc(15px*var(--fs));color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pr-top .grow{flex:1}
.pr-prog{height:5px;background:var(--fill);max-width:728px;width:calc(100% - 32px);margin:0 auto;border-radius:5px;overflow:hidden;flex:none}
.pr-prog i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .5s var(--ease)}
.pr-body{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;min-height:0}
.flash{width:100%;max-width:640px;background:var(--surface);border-radius:28px;box-shadow:var(--shadow-lg);padding:30px 24px;text-align:center;min-height:min(320px,52vh);display:flex;flex-direction:column;justify-content:center;gap:16px;margin:auto}
.flash.in{animation:cardIn .45s var(--ease) both}
.flash.reveal>*:not(:first-child){animation:rise .4s var(--ease) both}
.flash.reveal>*:nth-child(3){animation-delay:.05s} .flash.reveal>*:nth-child(4){animation-delay:.1s} .flash.reveal>*:nth-child(5){animation-delay:.15s}
.flash.ok{animation:cardOk .34s var(--ease) forwards}
.flash.again{animation:cardShake .4s var(--ease)}
@keyframes cardIn{from{opacity:0;transform:translateX(60px) rotate(2deg) scale(.96)}}
@keyframes cardOk{0%{box-shadow:var(--shadow-lg),0 0 0 0 rgba(52,199,89,.6)}40%{box-shadow:var(--shadow-lg),0 0 0 10px rgba(52,199,89,.35)}100%{opacity:0;transform:translateX(-80px) rotate(-3deg) scale(.95)}}
@keyframes cardShake{0%,100%{transform:none}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
.flash .q-en{font-size:calc(clamp(22px,4.8vw,28px)*var(--fs));font-weight:600;line-height:1.3;letter-spacing:-.025em}
.flash .zh{justify-content:center;margin:0;cursor:default}
.flash .zh:hover,.flash .zh:active{background:none}
.flash .c b{font-size:calc(clamp(28px,6.5vw,38px)*var(--fs))}
.flash .c i{font-size:max(12px,calc(15px*var(--fs)))}
.flash .divider{height:1px;background:var(--sep);margin:2px 0}
.flash .say-big{position:relative;align-self:center;display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:20px;background:var(--fill);color:var(--accent);font-weight:600;font-size:calc(15px*var(--fs))}
.flash .say-big[aria-pressed="true"]{color:var(--amber);background:var(--amber-soft)}
.flash-acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.flash .note{font-size:calc(15px*var(--fs))}
.pr-btns{display:flex;gap:12px;justify-content:center;padding:10px 16px 16px;max-width:760px;width:100%;margin:0 auto;flex:none}
.pr-btns .btn{flex:1;height:56px;font-size:calc(17px*var(--fs));border-radius:16px;max-width:320px}
.pr-btns .btn.ghost{color:var(--ink)}
.pr-hint{text-align:center;font-size:max(12px,calc(13px*var(--fs)));color:var(--muted);padding-bottom:12px;flex:none}
@media (hover:none){.pr-hint{display:none}}
.done h2{margin:0;font-size:calc(30px*var(--fs));letter-spacing:-.03em}
.done p{margin:0;color:var(--muted);font-size:calc(16px*var(--fs))}
.done .big-tick{width:76px;height:76px;margin:0 auto 4px;border-radius:50%;background:var(--jade-fill);color:#fff;display:grid;place-items:center;animation:pop .6s var(--spring) both .1s}
.done .big-tick svg{width:40px;height:40px}
.done .big-tick path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s var(--ease) forwards .35s}
@keyframes draw{to{stroke-dashoffset:0}}

/* ── say it and compare ── */
.sh-en{font-size:calc(16px*var(--fs));color:var(--muted)}
.sh-steps{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.sh-steps span{padding:5px 12px;border-radius:14px;background:var(--fill);color:var(--muted);font-size:max(12px,calc(13px*var(--fs)));font-weight:600;transition:background .3s,color .3s,transform .3s var(--spring)}
.sh-steps span.on{background:var(--accent);color:#fff;transform:scale(1.06)}
.sh-mic{position:relative;align-self:center;width:96px;height:96px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 35%,transparent);transition:background .3s,transform .18s var(--spring),box-shadow .3s}
.sh-mic svg{width:40px;height:40px}
.sh-mic:active{transform:scale(.92)}
[data-state="listen"] .sh-mic,[data-state="compare"] .sh-mic,[data-state="ask"] .sh-mic{background:var(--fill);color:var(--accent);box-shadow:none}
[data-state="rec"] .sh-mic{background:#FF3B30;color:#fff;animation:recpulse 1.2s ease-in-out infinite}
@keyframes recpulse{50%{box-shadow:0 0 0 16px rgba(255,59,48,.18)}}
.sh-meter{--lv:0;display:flex;align-items:center;justify-content:center;gap:5px;height:34px}
.sh-meter i{width:6px;border-radius:3px;background:var(--fill-2);height:calc(6px + 28px * var(--lv) * var(--k,1));transition:height .08s linear,background .2s}
[data-state="rec"] .sh-meter i{background:#FF3B30}
.sh-meter i:nth-child(1),.sh-meter i:nth-child(9){--k:.35}.sh-meter i:nth-child(2),.sh-meter i:nth-child(8){--k:.6}
.sh-meter i:nth-child(3),.sh-meter i:nth-child(7){--k:.8}.sh-meter i:nth-child(4),.sh-meter i:nth-child(6){--k:.95}
.sh-msg{font-size:calc(15px*var(--fs));font-weight:600;color:var(--ink-2);min-height:1.5em}

/* ── me ── */
.me-card{display:flex;gap:16px;align-items:center;background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);margin-top:20px}
.lv{flex:none;width:80px;height:80px;border-radius:22px;background:linear-gradient(160deg,#FF5A4F,#C8231A);color:#fff;display:grid;place-items:center;text-align:center;line-height:1;box-shadow:0 6px 18px rgba(200,35,26,.3)}
.lv small{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;opacity:.9}
.lv b{display:block;font-size:36px;font-weight:700;margin-top:2px;letter-spacing:-.03em}
.me-id{min-width:0;flex:1}
.me-id .zhT{font:600 calc(24px*var(--fs))/1.15 var(--zh)}
.me-id .enT{font-weight:600;font-size:calc(16px*var(--fs))}
.me-id small{display:block;font-size:max(12px,calc(14px*var(--fs)));color:var(--muted);margin-top:6px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.stats3 div{background:var(--surface);border-radius:18px;padding:14px 8px;text-align:center;box-shadow:var(--shadow)}
.stats3 b{display:flex;align-items:center;justify-content:center;gap:5px;font-size:calc(24px*var(--fs));letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stats3 b svg{width:20px;height:20px}
.stats3 small{display:block;font-size:max(12px,calc(13px*var(--fs)));color:var(--muted)}
.flame{color:#FF9500}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--surface);border-radius:var(--r-lg);padding:14px 10px;box-shadow:var(--shadow)}
.day{text-align:center}
.day i{display:grid;place-items:center;aspect-ratio:1;max-width:44px;margin:0 auto;border-radius:50%;background:var(--fill);color:var(--muted);font-style:normal;font-weight:700;font-size:14px}
.day i svg{width:18px;height:18px}
.day.ok i{background:var(--jade-fill);color:#fff}
.day.today i{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.day small{display:block;margin-top:6px;font-size:12px;color:var(--muted);font-weight:600}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{background:var(--surface);border-radius:18px;padding:16px 12px;text-align:center;box-shadow:var(--shadow)}
.badge span{display:grid;place-items:center;width:58px;height:58px;margin:0 auto;border-radius:50%;background:linear-gradient(160deg,#FFF3D6,#FFD98A);font-size:30px;line-height:1}
.badge b{display:block;font-size:calc(15px*var(--fs));margin-top:8px}
.badge small{display:block;font-size:max(12px,calc(13px*var(--fs)));color:var(--muted);margin-top:2px}
.badge.off{opacity:.55}
.badge.off span{filter:grayscale(1);background:var(--fill)}
.mrow{display:flex;align-items:center;gap:10px;padding:13px 16px;text-decoration:none;position:relative}
.mrow+.mrow::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.mrow b{flex:1;min-width:0;font-size:calc(16px*var(--fs));font-weight:500}
.mrow span{display:flex;gap:4px}
.mrow span i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff}
.mrow span i svg{width:12px;height:12px}
.mrow span i.off{background:var(--fill);color:transparent}
.mrow em{font-style:normal;font-size:max(12px,calc(14px*var(--fs)));color:var(--muted);min-width:3em;text-align:right;font-variant-numeric:tabular-nums}
.mrow .chev{width:14px;height:14px;color:var(--muted);opacity:.6}

/* ── ink-wash art ── */
.art svg{display:block;width:100%;height:100%}
.art .w{fill:var(--wash)} .art .ws{stop-color:var(--wash)} .art .pp{fill:var(--paper)} .art .pps{stop-color:var(--paper)}
.art .seal{fill:var(--accent)} .art .st{fill:none;stroke:var(--wash)} .art .sp{fill:none;stroke:var(--paper)}
.bgart{position:fixed;left:0;right:0;bottom:0;height:40vh;z-index:-1;pointer-events:none;opacity:.6}
.pr-art{position:absolute;left:0;right:0;bottom:0;height:38vh;pointer-events:none;z-index:0;opacity:.7}
.pr>*:not(.pr-art){position:relative;z-index:1}
@media (max-width:700px){.mhead-art{width:85%;opacity:.45}}

/* ── toast: a capsule that springs up ── */
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom));transform:translate(-50%,24px) scale(.9);background:color-mix(in srgb,var(--ink) 92%,transparent);color:var(--bg);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:12px 18px;border-radius:22px;font-size:calc(15px*var(--fs));font-weight:500;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .45s var(--spring);z-index:60;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* ── tab bar: frosted, like iOS ── */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{display:grid;grid-template-columns:repeat(5,1fr);max-width:600px;margin:0 auto;height:var(--tab-h);padding:0 4px}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600;position:relative;min-width:0;letter-spacing:0}

.fabs{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:calc(var(--tab-h) + 14px + env(safe-area-inset-bottom));z-index:25;display:flex;flex-direction:column;align-items:flex-start;gap:10px;pointer-events:none}
.fab{pointer-events:auto;height:44px;min-width:44px;padding:0 16px;border-radius:22px;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);

.fab[hidden]{display:none}

.tipbox{position:fixed;left:0;top:0;z-index:80;max-width:min(320px,calc(100vw - 16px));background:color-mix(in srgb,var(--ink) 94%,transparent);color:var(--bg);border-radius:14px;padding:11px 14px;box-shadow:0 14px 36px rgba(0,0,0,.3);

.coach-card{position:fixed;width:min(330px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border-radius:20px;padding:16px 16px 12px;box-shadow:0 20px 50px rgba(0,0,0,.4);transition:left .45s var(--sheet-ease),top .45s var(--sheet-ease);animation:rise .4s var(--ease)}
.coach-card h4{margin:0 0 4px;font-size:calc(18px*var(--fs));font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}

<script>
(function () {
"use strict";

/* ───────────── storage ───────────── */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
// iPhone mutes the built-in voice when the phone is on silent, so iPhones/iPads start on the online voice.
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const S = Object.assign({ pinyin: true, tones: true, slow: false, autoplay: true, theme: "auto", motion: true, dir: "en", fs: 1, engine: IOS ? "online" : "device" }, store.get("mt_settings_v1", {}));
// Text size steps for Settings → Text size. Every font size in the CSS is multiplied by --fs.
const FS = [0.9, 1, 1.1, 1.2, 1.35, 1.5];
const fsIndex = () => FS.reduce((best, v, i) => Math.abs(v - S.fs) < Math.abs(FS[best] - S.fs) ? i : best, 1);
document.documentElement.style.setProperty("--fs", FS[fsIndex()]);
const known = new Set(store.get("mt_known_v1", []));
const saveS = () => store.set("mt_settings_v1", S);
const saveKnown = () => store.set("mt_known_v1", [...known]);
// Favourites: starred phrases and starred "Remember these" cards, saved on this device.
const favs = new Set(store.get("mt_fav_v1", []));
const favKeys = new Set(store.get("mt_favkeys_v1", []));
const saveFavs = () => { store.set("mt_fav_v1", [...favs]); store.set("mt_favkeys_v1", [...favKeys]); };

/* ───────────── game: daily goal, streak, points, levels, medals ─────────────
   Points are worked out, not stored: 10 for every phrase marked known, 2 for every practice card answered.
   G.days["2026-10-04"] = [phrases learned that day, 1 if the daily goal was reached]. */
const G = Object.assign({ days: {}, reviews: 0, goal: 10 }, store.get("mt_game_v1", {}));
const saveG = () => store.set("mt_game_v1", G);
const dayKey = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const today = () => G.days[dayKey()] || [0, 0];
const countedToday = new Set();   // a phrase counts towards the goal once per visit, however often it is ticked
function bump(id) {
  if (countedToday.has(id)) return;
  countedToday.add(id);
  const k = dayKey(), d = G.days[k] || [0, 0];
  d[0]++; if (d[0] >= G.goal) d[1] = 1;
  G.days[k] = d; saveG();
}
function streak() {
  const d = new Date(); let n = 0;
  if (!today()[1]) d.setDate(d.getDate() - 1);   // today not finished yet: yesterday keeps the streak alive
  while ((G.days[dayKey(d)] || [])[1]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function bestStreak() {
  let best = 0, run = 0, prev = null;
  Object.keys(G.days).sort().forEach(k => {
    if (!G.days[k][1]) return;
    const t = new Date(k + "T00:00:00").getTime();
    run = prev != null && Math.round((t - prev) / 864e5) === 1 ? run + 1 : 1;
    prev = t; best = Math.max(best, run);
  });
  return best;
}
const xp = () => known.size * 10 + G.reviews * 2;
// Level ladder: points needed, Chinese title, English title.
const LEVELS = [[0, "新手", "Newcomer"], [50, "学徒", "Apprentice"], [150, "旅客", "Traveller"], [300, "常客", "Regular"], [500, "空乘", "Cabin Crew"],
  [800, "乘务长", "Purser"], [1200, "副驾驶", "First Officer"], [2000, "机长", "Captain"], [3500, "总监", "Director"], [6000, "总裁", "President"], [9000, "董事长", "Chairman"]];
function levelOf(x) {
  let i = 0; while (i + 1 < LEVELS.length && x >= LEVELS[i + 1][0]) i++;
  const nx = LEVELS[i + 1];
  return { n: i + 1, zh: LEVELS[i][1], en: LEVELS[i][2], pct: nx ? (x - LEVELS[i][0]) / (nx[0] - LEVELS[i][0]) * 100 : 100,
    next: nx ? { n: i + 2, zh: nx[1], en: nx[2], left: nx[0] - x } : null };
}
// Module medals: bronze at 25% known, silver at 50%, gold at 100%.
const MEDAL = ["", "🥉", "🥈", "🥇"], MEDAL_NAME = ["", "Bronze", "Silver", "Gold"];
function medal(m) { const n = m.items.length; if (!n) return 0; const r = knownIn(m.items) / n; return r >= 1 ? 3 : r >= 0.5 ? 2 : r >= 0.25 ? 1 : 0; }
// Runs a change to progress, then celebrates anything it unlocked.
function withRewards(p, change) {
  const m = BY[p.mod], l0 = levelOf(xp()).n, m0 = m ? medal(m) : 0, g0 = today()[1];
  change();
  const l1 = levelOf(xp()), m1 = m ? medal(m) : 0, msgs = [];
  if (!g0 && today()[1]) msgs.push(`Daily goal reached! 🔥 ${streak()}-day streak`);

/* ───────────── parsing ─────────────
   Line:  Level | English | 中文 | note        "# Title | 标题" = group
   字[pīn] after a character fixes its pinyin. */
function parsePhrases(modId, text) {
  const groups = []; let g = null;
  String(text || "").split("\n").forEach(raw => {
    const line = raw.trim();
    if (!line || line.startsWith("//")) return;
    if (line.startsWith("#")) {
      const [t, z] = line.slice(1).split("|").map(s => s.trim());
      g = { title: t || "Phrases", zh: z || "", items: [] }; groups.push(g); return;
    }
    const parts = line.split("|").map(s => s.trim());
    let lvl = "M";
    if (/^[EMH]$/i.test(parts[0])) lvl = parts.shift().toUpperCase();
    const [en, zhRaw, note] = parts;
    if (!en || !zhRaw) return;
    let zh = "", ov = {};
    for (let i = 0; i < zhRaw.length; i++) {
      if (zhRaw[i] === "[") { const j = zhRaw.indexOf("]", i); if (j > i) { ov[zh.length - 1] = zhRaw.slice(i + 1, j).trim(); i = j; continue; } }
      zh += zhRaw[i];
    }
    if (!g) { g = { title: "Phrases", zh: "", items: [] }; groups.push(g); }
    g.items.push({ id: modId + "-" + hash(zh), mod: modId, en, zh, ov, lvl, note: note || "", group: g.title });
  });
  return groups;
}
function buildModule(def) {
  const groups = parsePhrases(def.id, def.phrases);
  return Object.assign({}, def, { groups, items: groups.flatMap(g => g.items) });
}

const TONE = { 1: "āēīōūǖĀĒĪŌŪ", 2: "áéíóúǘÁÉÍÓÚ", 3: "ǎěǐǒǔǚǍĚǏǑǓ", 4: "àèìòùǜÀÈÌÒÙ" };
const toneOf = py => { for (const t in TONE) if ([...py].some(ch => TONE[t].includes(ch))) return +t; return 5; };
function cells(p) {
  if (p._cells) return p._cells;
  const out = [];
  let arr = [];
  try { arr = window.pinyinPro ? pinyinPro.pinyin(p.zh, { type: "all" }) : []; } catch (e) {}
  if (!arr.length) arr = [...p.zh].map(ch => ({ origin: ch, pinyin: "", num: 0, isZh: /[一-鿿]/.test(ch) }));
  arr.forEach((o, i) => {
    if (o.isZh) {
      const py = p.ov[i] || o.pinyin;
      out.push({ ch: o.origin, py, t: p.ov[i] ? toneOf(py) : (o.num || 5) });
    } else {
      const last = out[out.length - 1];
      // keep runs like "SQ830" or "OK" together; punctuation stays its own cell
      if (last && !last.py && /[A-Za-z0-9:. ]/.test(o.origin) && /[A-Za-z0-9:. ]$/.test(last.ch)) last.ch += o.origin;
      else out.push({ ch: o.origin, py: "", t: 0 });

}
const pyText = p => cells(p).map(c => c.py).filter(Boolean).join(" ");
function zhHTML(p) {
  return cells(p).map(c => c.py
    ? `<span class="c t${c.t}"><b>${c.ch}</b><i>${c.py}</i></span>`
    : `<span class="c x"><b>${esc(c.ch)}</b><i></i></span>`).join("");
}

// Chinese inside ordinary text (the "Remember these" cards): every run of characters gets pinyin underneath,
// the same way phrases do. 字[pīn] fixes a reading, as in phrase lines.
function zhInline(text) {
  let out = "", last = 0, m;
  const re = /(?:[一-鿿](?:\[[^\]]*\])?)+/g;
  while ((m = re.exec(text))) {
    let zh = "";
    const ov = {};
    m[0].replace(/([一-鿿])(?:\[([^\]]*)\])?/g, (all, ch, py) => { if (py) ov[zh.length] = py.trim(); zh += ch; });
    // the whole run is one tappable piece, so a tap reads out the word or sentence, not a single character
    out += esc(text.slice(last, m.index)) + `<span class="zs" data-say="${zh}"${tip("hearWord")}>${zhHTML({ zh, ov })}</span>`;
    last = m.index + m[0].length;

/* ───────────── speech ───────────── */
let voice = null, warnedVoice = false, playingBtn = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /zh[-_]CN/i.test(v.lang) && /ting|婷|xiaoxiao|晓晓|yun/i.test(v.name))
       || vs.find(v => /zh[-_]CN/i.test(v.lang))
       || vs.find(v => /^cmn/i.test(v.lang))
       || vs.find(v => /^zh/i.test(v.lang) && !/HK|yue/i.test(v.lang)) || null;
  const el = $("#voiceName");
  if (el) el.textContent = S.engine === "online"
    ? "Online voice plays even when your iPhone is on silent. Needs internet. It uses Google Translate's free voice, which could change without notice — if it stops working, switch to \"This device\"."
    : (voice ? `Using ${voice.name} (${voice.lang}). Works offline. iPhone mutes this voice when the phone is on silent.` : (vs.length ? "No Mandarin voice found on this device." : "Works offline. iPhone mutes this voice when the phone is on silent."));
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
// Two voices: "online" plays a short audio clip (plays even when an iPhone is on silent, needs internet);
// "device" uses the phone/computer's built-in speech (works offline, but iPhone mutes it on silent).
const clip = new Audio();
try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
const onlineUrl = t => "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q=" + encodeURIComponent(t.slice(0, 190));
// Returns true if the built-in voice was cut off mid-sentence (the next line then needs a short pause before it).
let speakNo = 0, saying = null;   // saying keeps the current line alive: Safari drops one that nothing refers to
function stopAudio() {
  try { clip.pause(); } catch (e) {}
  speakNo++;   // anything still waiting to speak, or to fall back, is now out of date
  let cut = false;
  if ("speechSynthesis" in window && (speechSynthesis.speaking || speechSynthesis.pending)) { speechSynthesis.cancel(); cut = true; }
  if (playingBtn) playingBtn.classList.remove("playing");
  return cut;
}
function playOnline(text, done) {
  clip.onended = done;
  clip.onerror = () => { done(); toast("The online voice didn't load. Check your internet, or pick \"This device\" voice in settings."); };
  clip.src = onlineUrl(text);
  clip.defaultPlaybackRate = clip.playbackRate = S.slow ? 0.7 : 1;
  clip.play().catch(err => { if (err && err.name !== "AbortError") clip.onerror(); });
}
// then (optional) runs once the line has finished playing.
function speak(text, btn, then) {
  const cut = stopAudio(), no = ++speakNo;
  if (btn) { btn.classList.add("playing"); playingBtn = btn; }
  let over = false;
  const done = () => { if (btn) btn.classList.remove("playing"); if (then && !over && no === speakNo) { over = true; then(); } };
  if (S.engine === "online" && navigator.onLine !== false) return playOnline(text, done);
  if (!("speechSynthesis" in window)) { done(); toast("This browser can't play audio. Try the online voice in settings."); return; }
  pickVoice();
  const u = saying = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN"; if (voice) u.voice = voice;
  u.rate = S.slow ? 0.6 : 0.9;
  let started = false;
  u.onstart = () => { started = true; };
  u.onend = done;
  u.onerror = e => { done(); if (!started && no === speakNo && e.error !== "interrupted" && e.error !== "canceled") fallBack(); };
  // If the phone's own voice never starts, play the online one instead so there is always sound.
  const fallBack = () => { if (no !== speakNo || navigator.onLine === false) return; speechSynthesis.cancel(); playOnline(text, done); if (!warnedVoice) { warnedVoice = true; toast("This device's voice didn't start, so the online voice is playing instead."); } };
  const go = () => {
    if (no !== speakNo) return;
    try { speechSynthesis.resume(); } catch (e) {}
    speechSynthesis.speak(u);
    setTimeout(() => { if (!started && no === speakNo) fallBack(); }, 1800);
  };
  // iPhone loses a line that is spoken straight after another one is cancelled, so leave a short gap
  if (cut) setTimeout(go, 90); else go();
  if (!voice && !warnedVoice && speechSynthesis.getVoices().length) { warnedVoice = true; toast("No Mandarin voice on this device. Try the online voice in settings."); }
}

/* ───────────── motion helpers ─────────────

  [...el.children].forEach((c, i) => c.style.setProperty("--i", i));
  el.querySelectorAll(".cards,.hscroll,.badges,.keys-grid").forEach(g => [...g.children].forEach((c, j) => c.style.setProperty("--j", j)));
  void el.offsetWidth; el.classList.add("enter");
  clearTimeout(animateIn.t); animateIn.t = setTimeout(() => el.classList.remove("enter"), 1500);
}
function paneIn() {
  const p = $("#pane"); if (!p || !S.motion) return;
  p.classList.remove("pane-in"); p.querySelectorAll(".keys-grid").forEach(g => [...g.children].forEach((c, j) => c.style.setProperty("--j", j)));
  void p.offsetWidth; p.classList.add("pane-in");
}

/* ───────────── router ───────────── */
function route() {
  const q = $("#q").value.trim(), m = location.hash.match(/^#\/m\/([\w-]+)/);
  let page = "home";
  if (q) { page = "search"; renderSearch(q); }
  else if (m) { page = m[1] === "fav" ? "fav" : "module"; renderModule(m[1]); }
  else if (location.hash === "#/me") { page = "me"; renderMe(); }

  view.page = page;

  document.querySelectorAll(".tb[data-nav]").forEach(a => a.dataset.nav === page ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));

/* ───────────── bottom tab bar + floating buttons ───────────── */
function dailyPractice() {
  // Practise from the module in progress (or the first unfinished one), just enough cards to reach today's goal.
  const last = BY[store.get("mt_last_v1", "")];
  const src = [last].concat(MODS).find(m => m && m.items.some(p => !known.has(p.id)));
  const n = Math.max(5, Math.min(20, G.goal - today()[0]));
  // reviews that are due come first, then new phrases fill the rest of today's goal
  const due = shuffle(dueItems()).slice(0, n), fresh = shuffle((src ? src.items : ALL).filter(p => !known.has(p.id) && !due.includes(p))).slice(0, n - due.length);
  if (due.length) startPractice(due.concat(fresh), "Today · review" + (fresh.length && src ? " + " + src.title : ""), n, true);
  else startPractice(src ? src.items : ALL, src ? "Today · " + src.title : "Today", n);
}
$("#tabbar").addEventListener("click", e => {
  const b = e.target.closest(".tb");
  if (!b) return;
  if (b.dataset.go === "practice") return dailyPractice();
  if (b.dataset.go === "search") { window.scrollTo(0, 0); $("#q").focus(); return; }
  // a link: leave any search, and if we are already on that page just go back to its top
  const same = b.getAttribute("href") === (location.hash || "#/");
  if ($("#q").value) { $("#q").value = ""; if (same) route(); }
  if (same) window.scrollTo(0, 0);
});
const scrollToY = y => window.scrollTo({ top: Math.max(0, y), behavior: S.motion ? "smooth" : "auto" });
const stickyBottom = () => $(".top").offsetHeight + ($("#tabs") ? $("#tabs").offsetHeight : 0);
// Where "Next" goes: the next topic tab on a module page, otherwise the next section heading further down.

function updateFabs() {

/* ───────────── practice ───────────── */
const pr = { deck: [], i: 0, shown: false, got: 0, title: "" };
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// exact = use these items as they are (the daily mix of due reviews and new phrases).
function startPractice(items, title, limit, exact) {
  if (!items.length) return;
  const unknown = items.filter(p => !known.has(p.id));
  const pool = exact ? items.slice() : shuffle((unknown.length ? unknown : items).slice());
  pr.deck = limit ? pool.slice(0, limit) : pool.slice(0, 30);
  pr.i = 0; pr.got = 0; pr.pts = 0; pr.cheered = false; pr.shown = false; pr.anim = " in"; pr.busy = false; pr.title = title; pr.src = [items, title, limit, exact];

}
function closePractice() { $("#pr").classList.remove("open"); document.body.style.overflow = ""; stopAudio(); route(); }
function drawCard() {

    if (pr.got && !pr.cheered) { pr.cheered = true; confetti(); }

    return;
  }

  const say = `<div class="flash-acts"><button class="say-big" data-pr="say">${ICON.say} Listen</button><button class="say-big" data-pr="fav" aria-pressed="${favs.has(p.id)}">${ICON.star} ${favs.has(p.id) ? "Saved" : "Save"}</button></div>`;
  const zhBlock = (withPy) => `<div class="zh${withPy && S.pinyin ? "" : " no-py-local"}">${zhHTML(p)}</div>`;
  let html;
  if (S.dir === "en") {

  } else {

    : `<button class="btn primary" data-pr="show">Show answer</button>`;
  if (S.autoplay && (pr.shown ? S.dir === "en" : S.dir === "zh")) speak(p.zh, flash.querySelector(".say-big"));
}
function prAct(a) {
  const p = pr.deck[pr.i];
  if (pr.busy) return;
  // with animations on, the card reacts first (flies off for Got it, shakes for Again), then the next one slides in
  const later = (cls, ms, fn) => { if (!S.motion) return fn(); pr.busy = true; $("#flash").classList.remove("in", "reveal"); void $("#flash").offsetWidth; $("#flash").classList.add(cls); setTimeout(() => { pr.busy = false; fn(); }, ms); };
  if (a === "show") { pr.shown = true; pr.anim = " reveal"; drawCard(); }
  else if (a === "again" && pr.shown) later("again", 380, () => { G.reviews++; saveG(); srsAgain(p.id); pr.pts += 2; pr.deck.splice(pr.i, 1); pr.deck.splice(Math.min(pr.i + 3, pr.deck.length), 0, p); pr.shown = false; pr.anim = " in"; drawCard(); });
  else if (a === "got" && pr.shown) later("ok", 300, () => {

    srsGot(p.id);

  });

$("#pr").addEventListener("click", e => { const b = e.target.closest("[data-pr]"); if (b) prAct(b.dataset.pr); });
$("#prClose").addEventListener("click", closePractice);
$("#dirSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { S.dir = b.dataset.dir; saveS(); pr.shown = false; drawCard(); } });

/* ───────────── say it and compare ─────────────
   Hear a phrase, record yourself saying it, then hear the model and your own voice back to back.
   Nothing is uploaded: the recording stays in the page and is dropped when you move on. */
const sh = $("#sh");
let SH = null;
const mic = { stream: null, rec: null, chunks: [], ctx: null, meter: 0, stop: 0, url: "", mine: new Audio() };
const SH_MSG = { listen: "Listen to the model…", say: "Your turn — tap the microphone and say it.", rec: "Recording… tap to stop.", compare: "", ask: "How close was it? Try again, or move on." };
const SH_ICON = { listen: ICON.say, say: ICON.mic, rec: ICON.stop, compare: ICON.repeat, ask: ICON.repeat };
const audioMode = type => { try { if (navigator.audioSession) navigator.audioSession.type = type; } catch (e) {} };   // an iPhone needs to be told it will record as well as play
const shadowSet = items => shuffle(items.slice()).slice(0, 8).sort((a, b) => a.zh.length - b.zh.length);   // eight a round, shortest first
function startShadow(items, title, again) {
  if (!items.length) return;
  SH = { items, title, again, i: 0, done: 0, state: "", no: 0, tried: false };
  audioMode("play-and-record");
  sh.classList.add("open"); document.body.style.overflow = "hidden";
  drawShadow();
}
function closeShadow() {
  if (SH) SH.no++;

  if (mic.stream) { mic.stream.getTracks().forEach(t => t.stop()); mic.stream = null; }
  if (mic.ctx) { try { mic.ctx.close(); } catch (e) {} mic.ctx = null; }
  if (mic.url) { URL.revokeObjectURL(mic.url); mic.url = ""; }
  audioMode("playback");
  sh.classList.remove("open"); document.body.style.overflow = ""; SH = null; route();
}
function shState(st, msg) {
  SH.state = st;

  if (!b) return;
  card.dataset.state = st;
  card.querySelectorAll(".sh-steps span").forEach(x => x.classList.toggle("on", x.dataset.st === (st === "rec" ? "say" : st === "ask" ? "compare" : st)));
  b.querySelector("span").innerHTML = SH_ICON[st];
  b.setAttribute("aria-label", st === "say" ? "Start recording" : st === "rec" ? "Stop recording" : st === "listen" ? "Play the model again" : "Hear both again");
  $("#shMsg").textContent = msg || SH_MSG[st];
  $("#shBtns").innerHTML = st === "compare" || st === "ask"
    ? `<button class="btn ghost" data-s="retry">Try again</button><button class="btn primary" data-s="next">${SH.i + 1 < SH.items.length ? "Next" : "Finish"} →</button>`
    : `<button class="btn ghost" data-s="model">${ICON.say} Listen again</button><button class="btn ghost" data-s="next">Skip</button>`;
}
function drawShadow() {
  const n = SH.items.length, card = $("#shCard");
  SH.no++; SH.tried = false;
  $("#shBar").style.width = (SH.i / n * 100) + "%";
  $("#shDone").textContent = SH.done ? SH.done + " said" : "";
  if (SH.i >= n) {
    $("#shCount").textContent = SH.title;
    card.className = "flash done"; delete card.dataset.state;
    card.className = "flash done in"; card.innerHTML = `${SH.done ? `<div class="big-tick">${ICON.checkBig}</div>` : ""}<h2>${SH.done ? "Nicely spoken" : "Round done"}</h2><p>${SH.done} of ${n} said out loud · +${SH.done * 2} pts</p>`;
    if (SH.done === n && n > 1) confetti();
    $("#shBtns").innerHTML = `<button class="btn ghost" data-s="close">Close</button>${SH.again ? `<button class="btn primary" data-s="again">Another round</button>` : ""}`;
    return;
  }
  const p = SH.items[SH.i];
  $("#shCount").textContent = n > 1 ? `${SH.i + 1} / ${n}` : "Say it";
  card.className = "flash in";
  card.innerHTML = `<div class="zh${S.pinyin ? "" : " no-py-local"}">${zhHTML(p)}</div><div class="sh-en">${esc(p.en)}</div>
    <div class="sh-steps"><span data-st="listen">① Listen</span><span data-st="say">② Say it</span><span data-st="compare">③ Compare</span></div>
    <button class="sh-mic" data-s="mic"><span></span></button>
    <div class="sh-meter" aria-hidden="true">${"<i></i>".repeat(9)}</div>

function playModel() {

async function startRec() {

sh.addEventListener("click", e => {
  const b = e.target.closest("[data-s]");
  if (!b || !SH) return;

  else if (a === "model" || a === "retry") playModel();
  else if (a === "next") {

  else if (a === "mic") { if (SH.state === "say") startRec(); else if (SH.state === "rec") stopRec(); else if (SH.state === "listen") playModel(); else playBoth(); }
});

const HELP_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v5"/><circle cx="12" cy="7.6" r=".6" fill="currentColor"/></svg>';
const coach = { el: null, steps: [], i: 0 };
function helpSteps() {
  const page = view.page, mine = page === "module" || page === "fav" ? HELP.module : HELP[page] || [];
  const list = page === "home" ? HELP.common.concat(mine, HELP.tabbar) : mine.concat(HELP.common, HELP.tabbar);
  return list.filter(s => { const el = document.querySelector(s.sel); return el && el.getClientRects().length; });
}
function startHelp() {
  store.set("mt_help_seen", 1); $("#helpBtn").classList.remove("new");
  toggleSheet(false);
  coach.steps = helpSteps(); coach.i = 0;
  if (!coach.steps.length) return;
  const el = coach.el = document.createElement("div");
  el.className = "coach"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Help guide");
  el.innerHTML = `<div class="coach-hole"></div><svg class="coach-svg" aria-hidden="true"><path class="shaft"/><path class="head"/></svg><div class="coach-card" aria-live="polite"></div>`;
  document.body.appendChild(el);
  el.addEventListener("click", e => {
    const b = e.target.closest("[data-c]");
    if (b) { const a = b.dataset.c; a === "next" ? helpGo(coach.i + 1) : a === "back" ? helpGo(coach.i - 1) : endHelp(); }
  });
  helpGo(0);
}
function endHelp() { if (coach.el) { coach.el.remove(); coach.el = null; } }
function helpGo(i) {
  if (i >= coach.steps.length) return endHelp();
  coach.i = Math.max(0, i);
  const s = coach.steps[coach.i], target = document.querySelector(s.sel);
  if (!target) return helpGo(coach.i + 1);
  // bring the button into view, clear of the frosted bars at the top and bottom
  const r = target.getBoundingClientRect(), topSafe = stickyBottom() + 16, botSafe = window.innerHeight - ($("#tabbar").offsetHeight || 0) - 16;
  const inBar = !!target.closest(".top,.tabbar");
  if (!inBar && (r.top < topSafe || r.bottom > botSafe)) {
    window.scrollTo({ top: window.scrollY + r.top - Math.max(topSafe, (window.innerHeight - r.height) / 2 - 60), behavior: S.motion ? "smooth" : "auto" });
    setTimeout(() => helpDraw(s, target), S.motion ? 420 : 30);
  } else helpDraw(s, target);
}
function helpDraw(s, target) {
  if (!coach.el) return;
  const W = window.innerWidth, H = window.innerHeight, pad = 8;
  const r = target.getBoundingClientRect();
  const box = { l: Math.max(6, r.left - pad), t: Math.max(6, r.top - pad), r: Math.min(W - 6, r.right + pad), b: Math.min(H - 6, r.bottom + pad) };
  const hole = coach.el.querySelector(".coach-hole");
  Object.assign(hole.style, { left: box.l + "px", top: box.t + "px", width: box.r - box.l + "px", height: box.b - box.t + "px",
    borderRadius: Math.min(22, (box.b - box.t) / 2) + "px" });
  const card = coach.el.querySelector(".coach-card"), n = coach.steps.length, last = coach.i === n - 1;
  card.innerHTML = `<button class="coach-x" data-c="end" aria-label="Close the guide"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><h4>${HELP_ICON}${esc(s.t)}</h4><p>${esc(s.d)}</p>
    <div class="coach-foot"><span class="coach-count">${coach.i + 1} of ${n}</span>
    ${coach.i ? `<button class="coach-btn" data-c="back">Back</button>` : ""}<button class="coach-btn primary" data-c="${last ? "end" : "next"}">${last ? "Done" : "Next"}</button></div>`;
  card.style.animation = "none"; void card.offsetWidth; card.style.animation = "";
  // the callout goes below the button if there is room, otherwise above, with a gap for the arrow
  const cw = card.offsetWidth, ch = card.offsetHeight, gap = Math.min(70, Math.max(44, H * 0.08));
  const below = H - box.b > ch + gap + 16 || box.t < ch + gap + 16 && H - box.b > box.t;
  const cx = (box.l + box.r) / 2;
  const left = Math.max(16, Math.min(W - cw - 16, cx - cw / 2));
  let top = below ? box.b + gap : box.t - gap - ch;
  top = Math.max(16, Math.min(H - ch - 16, top));
  card.style.left = left + "px"; card.style.top = top + "px";
  // a curved arrow from the callout to the button
  const sx = Math.max(left + 28, Math.min(left + cw - 28, cx + (cx < W / 2 ? 30 : -30))), sy = below ? top - 4 : top + ch + 4;
  const ex = Math.max(box.l + 10, Math.min(box.r - 10, cx)), ey = below ? box.b + 8 : box.t - 8;
  const dy = ey - sy, bend = (sx < ex ? -1 : 1) * Math.min(60, Math.abs(ex - sx) * 0.4 + 24);
  const c1x = sx + bend, c1y = sy + dy * 0.45, c2x = ex, c2y = ey - dy * 0.45;
  const shaft = coach.el.querySelector(".shaft"), head = coach.el.querySelector(".head");
  shaft.setAttribute("d", `M${sx},${sy} C${c1x},${c1y} ${c2x},${c2y} ${ex},${ey}`);
  const ang = Math.atan2(ey - c2y, ex - c2x), L = 13;
  head.setAttribute("d", `M${ex - L * Math.cos(ang - 0.5)},${ey - L * Math.sin(ang - 0.5)} L${ex},${ey} L${ex - L * Math.cos(ang + 0.5)},${ey - L * Math.sin(ang + 0.5)}`);
  const len = Math.ceil(shaft.getTotalLength ? shaft.getTotalLength() : 300);
  shaft.style.setProperty("--len", len);
  [shaft, head].forEach(p => { p.style.animation = "none"; void p.getBBox(); p.style.animation = ""; });
  card.querySelector(".coach-btn.primary").focus({ preventScroll: true });
}

/* ───────────── tips: shown on hover (mouse) and on keyboard focus; touch screens have no hover, so nothing shows there ───────────── */
(function () {
  const box = document.createElement("div"), fine = window.matchMedia("(hover: hover) and (pointer: fine)");
  box.className = "tipbox"; box.setAttribute("role", "tooltip"); document.body.appendChild(box);
  let cur = null, timer = 0, mx = 0, my = 0;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const place = (x, y, above) => {
    let top = y + 20;
    if (top + box.offsetHeight > window.innerHeight - 8) top = (above == null ? y : above) - box.offsetHeight - 12;
    box.style.left = clamp(x - 24, 8, window.innerWidth - box.offsetWidth - 8) + "px"; box.style.top = Math.max(8, top) + "px";
  };
  const show = (el, x, y, above) => {
    const [title, text] = el.dataset.tip.split("|");
    box.textContent = "";
    if (text) { const b = document.createElement("b"); b.textContent = title; box.appendChild(b); }
    const sp = document.createElement("span"); sp.textContent = text || title; box.appendChild(sp);
    place(x, y, above); box.classList.add("show");
  };
  const hide = () => { clearTimeout(timer); box.classList.remove("show"); cur = null; };
  document.addEventListener("mouseover", e => {
    if (!fine.matches) return;
    const el = e.target.closest ? e.target.closest("[data-tip]") : null;
    if (el === cur) return;
    hide();
    if (!el) return;
    cur = el;
    timer = setTimeout(() => { if (cur === el) show(el, mx, my); }, 350);
  });
  document.addEventListener("mousemove", e => { mx = e.clientX; my = e.clientY; if (cur && box.classList.contains("show")) place(mx, my); });
  document.addEventListener("focusin", e => {
    const el = e.target.closest ? e.target.closest("[data-tip]") : null;
    if (!el || !e.target.matches(":focus-visible")) return;
    const r = el.getBoundingClientRect(); cur = el; show(el, r.left + 24, r.bottom - 8, r.top);
  });
  document.addEventListener("focusout", hide);
  document.addEventListener("click", hide, true);
  document.addEventListener("mouseleave", hide);
  window.addEventListener("scroll", hide, { passive: true });
  window.addEventListener("hashchange", hide);
})();
